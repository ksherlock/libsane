name: CMake

on: [push]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true

    - name: Install Dependencies
      shell: bash
      run: |
        case $RUNNER_OS in
          Linux)
            sudo apt-get install ragel
            ;;
          macOS)
            brew install ragel
            ;;
        esac

    - name: Configure CMake
      shell: bash
      run: cmake -S. -Bbuild -DCMAKE_BUILD_TYPE="$BUILD_TYPE"

    - name: Build
      shell: bash
      run: |
        case $RUNNER_OS in
          Linux)
            jobs=$(nproc)
            ;;
          macOS)
            jobs=$(sysctl -n hw.activecpu)
            ;;
          *)
            jobs=1
        esac
        cmake --build build --config "$BUILD_TYPE" --parallel "$jobs"
      
    - name: Test
      working-directory: build
      shell: bash
      run: ./sane_test
